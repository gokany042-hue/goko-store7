{% extends "base.html" %}{% block content %}<div class="detail">{% if product.image %}<img src="{{ url_for('static', filename='uploads/' + product.image) }}" alt="{{ product.name }}">{% else %}<div class="placeholder big">GØ</div>{% endif %}<div><p class="eyebrow">{{ product.category }}</p><h1>{{ product.name }}</h1><p class="muted">{{ product.description }}</p><h2 class="price">{{ "%.2f"|format(product.price) }} ₺</h2><p class="stock">Stok: {{ product.stock }}</p><form method="post" action="{{ url_for('add_to_cart', product_id=product.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button" {% if product.stock < 1 %}disabled{% endif %}>Sepete Ekle</button></form></div></div>{% endblock %}
