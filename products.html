{% extends "admin/base_admin.html" %}{% block admin_content %}<div class="sectionhead"><h2>Ürün Yönetimi</h2><a class="button" href="{{ url_for('product_form') }}">+ Ürün Ekle</a></div>{% for p in products %}<div class="panel cartrow"><div><b>{{ p.name }}</b><p class="muted">{{ p.category }} · Stok: {{ p.stock }} · {{ "%.2f"|format(p.price) }} ₺</p></div><div class="actions"><a class="button secondary" href="{{ url_for('product_form', product_id=p.id) }}">Düzenle</a><form method="post" action="{{ url_for('delete_product', product_id=p.id) }}" onsubmit="return confirm('Bu ürünü silmek istediğine emin misin?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger">Sil</button></form></div></div>{% else %}<div class="empty">Henüz ürün eklenmemiş.</div>{% endfor %}{% endblock %}
