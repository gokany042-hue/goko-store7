{% extends "admin/base_admin.html" %}{% block admin_content %}<div class="auth wide"><h2>{{ 'Ürünü Düzenle' if product else 'Yeni Ürün Ekle' }}</h2><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Ürün adı</label><input name="name" required value="{{ product.name if product else '' }}"><label>Açıklama</label><textarea name="description" rows="4">{{ product.description if product else '' }}</textarea><label>Kategori</label><input name="category" value="{{ product.category if product else 'Oyun Ürünleri' }}"><div class="two"><div><label>Fiyat (₺)</label><input type="number" name="price" min="0" step="0.01" required value="{{ product.price if product else '' }}"></div><div><label>Stok</label><input type="number" name="stock" min="0" required value="{{ product.stock if product else 0 }}"></div></div><label>Ürün görseli</label><input type="file" name="image" accept=".png,.jpg,.jpeg,.webp"><button class="button full">Kaydet</button></form></div>{% endblock %}
