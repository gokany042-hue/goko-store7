{% extends "admin/base_admin.html" %}{% block admin_content %}<h2>Sipariş Yönetimi</h2>{% for o in orders %}<div class="panel order"><div class="cartrow"><b>#{{ o.id }} · {{ o.user.username }}</b><strong>{{ "%.2f"|format(o.total) }} ₺</strong></div><p>{{ o.items_text }}</p><form method="post" action="{{ url_for('update_order', order_id=o.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><select name="status">{% for s in ['Beklemede','İşleniyor','Tamamlandı','İptal'] %}<option {% if o.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select><button class="button smallbtn">Durumu Güncelle</button></form><small>{{ o.created_at.strftime('%d.%m.%Y %H:%M') }}</small></div>{% else %}<div class="empty">Henüz sipariş yok.</div>{% endfor %}{% endblock %}
